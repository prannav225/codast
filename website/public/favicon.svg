<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Terminal Dark Background Container -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="12"/>

  <!-- Exact Pixel Grid Chevron '>' -->
  <!-- Row 1: █▄ -->
  <rect x="52" y="112" width="36" height="72" fill="#FFFFFF" />
  <rect x="88" y="148" width="36" height="36" fill="#FFFFFF" />

  <!-- Row 2: ▀█▄ -->
  <rect x="124" y="184" width="36" height="36" fill="#FFFFFF" />
  <rect x="160" y="184" width="36" height="72" fill="#FFFFFF" />
  <rect x="192" y="220" width="36" height="36" fill="#FFFFFF" />

  <!-- Row 3: ▄█▀ -->
  <rect x="192" y="256" width="36" height="36" fill="#FFFFFF" />
  <rect x="160" y="256" width="36" height="72" fill="#FFFFFF" />
  <rect x="124" y="292" width="36" height="36" fill="#FFFFFF" />

  <!-- Row 4: █▀ -->
  <rect x="88" y="328" width="36" height="36" fill="#FFFFFF" />
  <rect x="52" y="328" width="36" height="72" fill="#FFFFFF" />

  <!-- Upper Solid Block Cursor '████' (Rows 1 & 2) -->
  <rect x="332" y="112" width="144" height="144" fill="#FFFFFF" />

  <!-- Lower Underscore Cursor '▄▄▄▄' (Row 4) -->
  <rect x="332" y="364" width="144" height="36" fill="#FFFFFF" />
</svg>
